<!-- src/app/shared/ui/app-modal/app-modal.component.html -->
<div class="modal-overlay" *ngIf="isOpen" (click)="onBackdropClick()">
    <div class="modal-content" [class]="type" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-icon" *ngIf="type === 'warning'">⚠️</div>
            <div class="modal-icon" *ngIf="type === 'error'">❌</div>
            <div class="modal-icon" *ngIf="type === 'info'">ℹ️</div>
            <h3>{{ title }}</h3>
        </div>
        <div class="modal-body">
            <p>{{ message }}</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" (click)="cancel()">{{ cancelText }}</button>
            <button class="btn btn-confirm" [class]="type" (click)="confirm()">{{ confirmText }}</button>
        </div>
    </div>
</div>
