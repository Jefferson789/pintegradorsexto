<div class="form-layout">
    <div class="form-header">
        <div>
            <h2>
                {{ title }}
            </h2>
            @if (subtitle) {
            <p>
                {{ subtitle }}
            </p>
            }
        </div>
        @if (showCloseButton) {
        <button type="button" class="close-btn" (click)="close.emit()">
            ✕
        </button>
        }
    </div>
    <div class="form-body">
        <ng-content></ng-content>
    </div>
</div>
